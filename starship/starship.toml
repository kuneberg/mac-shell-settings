format = """
$directory\
[](fg:black bg:third)\
(\
    $python\
    $conda\
    $nodejs\
    $c\
    $golang\
    $haskell\
    $java\
    $julia\
    $rust\
    [](fg:black bg:fourth)\
)\
(\
    $docker_context\
    [](fg:black bg:fifth)\
)\
(\
    $git_branch\
    $git_status\
    [](fg:sixth bg:seventh)\
)\
$time\
$cmd_duration\
[](fg:eighth)\
$line_break\
$character\
"""

# Palettes:
#   opal: sky blue.
#   amethyst: purple.
#   terra: sage green & terracotta.
#   ruby: red.
# To change the colors: change to the corresponding palette.

palette = "terra"

# Disables the blank line at the start of the prompt
add_newline = true


[palettes.opal]
first = "#38959E"
second = "#37929D"
third = "#358F9B"
fourth = "#358CA0"
fifth = "#3689A2"
sixth = "#3785A4"
seventh = "#3982A9"
eighth = "#3A7EAE"
error = "#C1121F"
# Text color:
black = "#272D37"
text = "#CBF4F8"
github = "#B02B10"

[palettes.amethyst]
first = "#6E43C4"
second = "#6A3EC0"
third = "#693CBC"
fourth = "#663AB7"
fifth = "#6238B1"
sixth = "#6037AC"
seventh = "#5D36A6"
eighth = "#5A359E"
error = "#C1121F"
# Text color:
black = "#272D37"
text = "#F2EBFF"
github = "#B02B10"

[palettes.terra]
first = "#F77D5B"
second = "#F17A5E"
third = "#EC7760"
fourth = "#E67563"
fifth = "#E17266"
sixth = "#DB6F68"
seventh = "#D66C6B"
eighth = "#D0686E"
error = "#C1121F"
# Text color (the coral->rose gradient is light, so segment text is dark ink):
black = "#2B211B"
text = "#2B211B"
github = "#551A0E"

[palettes.ruby]
first = "#873739"
second = "#8B383B"
third = "#8D393C"
fourth = "#8F393D"
fifth = "#91393E"
sixth = "#92393E"
seventh = "#93393F"
eighth = "#98393F"
error = "#C1121F"
# Text color:
black = "#272D37"
text = "#F2EBFF"
github = "#450920"

[directory]
style = "bg:third fg:text"
format = "[](third)[   $path ]($style)($style)[$read_only]($read_only_style)"
truncation_symbol = "…/"
truncate_to_repo = true
read_only ="  "

[directory.substitutions]
"Documents" = "  "
"Downloads" = "  "
"Music" = "  "
"Pictures" = "  "

[c]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[golang]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[python]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
python_binary = ["./venv/bin/python", "./env/Scripts/python", "python", "python3", "python2"]
format = '[$symbol($version)]($style)[ (\($virtualenv\)) ](bg:fourth fg:text)'

[conda]
symbol = " "
style = "bg:fourth fg:text"
ignore_base = false
format = '[$symbol ($environment) ]($style)'

[haskell]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[java]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[julia]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[nodejs]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[rust]
symbol = " "
version_format = "${raw}"
style = "bg:fourth fg:text"
format = '[$symbol($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:fifth fg:text"
format = '[$symbol $context ]($style)'

[git_branch]
symbol = " "
style = "bg:sixth fg:text"
format = '[ $symbol$branch ]($style)'

[git_status]
format = '([\($all_status$ahead_behind\) ]($style))'
style = "bold bg:sixth fg:github"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:seventh fg:text"
format = '[  $time]($style)[](fg:seventh bg:eighth)'

[cmd_duration]
style = "bg:eighth fg:text"
format = '[  $duration ]($style)'

[character]
success_symbol = "[❯](bold fg:eighth)"
error_symbol = "[❯](bold fg:error)"

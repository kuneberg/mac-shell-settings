# Alacritty configuration — macOS
# Docs: https://alacritty.org/config-alacritty.html
# Linked to ~/.config/alacritty/alacritty.toml — reloads live on save.
#
# Mirrors ghostty/config: same font, srcery palette, 0.70 opacity + blur.
# Ghostty-only things with no Alacritty equivalent: font-thicken,
# macos-titlebar-style = tabs (no tabs — use tmux), window-save-state,
# shell-integration (zsh handles it), confirm-close-surface.

[general]
live_config_reload = true

[env]
# Alacritty would set TERM=alacritty; xterm-256color matches ghostty/iterm2
# on remote hosts and the RGB override in tmux/tmux.conf.
TERM = "xterm-256color"

# --- Font ---
[font]
size = 15.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
builtin_box_drawing = true

# --- Window ---
[window]
opacity = 0.70
blur = true
padding = { x = 0, y = 0 }
dynamic_padding = true
decorations = "Full"
startup_mode = "Windowed"
dynamic_title = true
option_as_alt = "Both"

# --- Theme (Srcery) ---
# Same ANSI-16 palette as ghostty/config and iterm2/srcery.json.
[colors.primary]
foreground = "#fce8c3"
# Srcery near-black background
background = "#1c1b19"

[colors.cursor]
cursor = "#fbb829"
text = "#1c1b19"

[colors.selection]
background = "#fce8c3"
text = "#1c1b19"

[colors.normal]
black = "#1c1b19"
red = "#ef2f27"
green = "#519f50"
yellow = "#fbb829"
blue = "#2c78bf"
magenta = "#e02c6d"
cyan = "#0aaeb3"
white = "#baa67f"

[colors.bright]
black = "#918175"
red = "#f75341"
green = "#98bc37"
yellow = "#fed06e"
blue = "#68a8e4"
magenta = "#ff5c8f"
cyan = "#2be4d0"
white = "#fce8c3"

# --- Cursor & mouse ---
[cursor]
style = { shape = "Block", blinking = "Never" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

# --- Behaviour ---
[selection]
# copy-on-select
save_to_clipboard = true

[scrolling]
history = 10000
multiplier = 3

[bell]
duration = 0

# --- Keyboard ---
[keyboard]
# Shift+Enter sends ESC+CR, which Claude Code (like Option+Enter) treats
# as "insert newline" instead of submit.
bindings = [
  { key = "Enter", mods = "Shift", chars = "\u001B\r" },
]

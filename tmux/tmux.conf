# tmux configuration — linked to ~/.tmux.conf
# Reload with: prefix + r

# --- Terminal & colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Keybindings ---
# Splits open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# vi-style copy to macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Status bar (Terra, matches the starship prompt) ---
set -g status-position bottom
set -g status-style "bg=#20241f,fg=#e8d7d0"
set -g status-left-length 30
set -g status-left "#[bold,fg=#2b211b,bg=#f77d5b] #S #[default] "
set -g status-right "#[fg=#a89a8f]%d %b #[bold,fg=#e8d7d0]%H:%M "
setw -g window-status-format "#[fg=#a89a8f] #I:#W "
setw -g window-status-current-format "#[bold,fg=#f5ede4,bg=#556f5a] #I:#W "
set -g pane-border-style "fg=#303a31"
set -g pane-active-border-style "fg=#f77d5b"
set -g message-style "bg=#3c4a3e,fg=#f5ede4"

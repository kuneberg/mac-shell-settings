# tmux configuration — linked to ~/.tmux.conf
# Reload with: prefix + r

# --- Terminal & colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Keybindings ---
# Splits open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# vi-style copy to macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Status bar (Srcery, matches the starship prompt) ---
set -g status-position bottom
set -g status-style "bg=#303030,fg=#fce8c3"
set -g status-left-length 30
set -g status-left "#[bold,fg=#1c1b19,bg=#fbb829] #S #[default] "
set -g status-right "#[fg=#918175]%d %b #[bold,fg=#fce8c3]%H:%M "
setw -g window-status-format "#[fg=#918175] #I:#W "
setw -g window-status-current-format "#[bold,fg=#fce8c3,bg=#444444] #I:#W "
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#fbb829"
set -g message-style "bg=#3a3a3a,fg=#fce8c3"

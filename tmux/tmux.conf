# tmux configuration — linked to ~/.tmux.conf
# Reload with: prefix + r

# --- Terminal & colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Keybindings ---
# Splits open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# vi-style copy to macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Status bar (Gruvbox Dark, matches the starship prompt) ---
set -g status-position bottom
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 30
set -g status-left "#[bold,fg=#fbf1c7,bg=#d65d0e] #S #[default] "
set -g status-right "#[fg=#a89984]%d %b #[bold,fg=#ebdbb2]%H:%M "
setw -g window-status-format "#[fg=#a89984] #I:#W "
setw -g window-status-current-format "#[bold,fg=#fbf1c7,bg=#665c54] #I:#W "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=#504945,fg=#fbf1c7"

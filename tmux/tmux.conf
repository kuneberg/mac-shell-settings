# tmux configuration — linked to ~/.tmux.conf
# Reload with: prefix + r

# --- Terminal & colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# --- Behaviour ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g focus-events on
setw -g mode-keys vi

# --- Keybindings ---
# Splits open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# vi-style copy to macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Status bar (Amethyst, matches the starship prompt) ---
set -g status-position bottom
set -g status-style "bg=#201c30,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bold,fg=#f2ebff,bg=#6e43c4] #S #[default] "
set -g status-right "#[fg=#8a84a8]%d %b #[bold,fg=#cdd6f4]%H:%M "
setw -g window-status-format "#[fg=#8a84a8] #I:#W "
setw -g window-status-current-format "#[bold,fg=#f2ebff,bg=#5a359e] #I:#W "
set -g pane-border-style "fg=#2e2a44"
set -g pane-active-border-style "fg=#6e43c4"
set -g message-style "bg=#372a5e,fg=#f2ebff"

# gdu — interactive disk usage explorer. Linked to ~/.gdu.yaml
# ignore-dirs replaces gdu's defaults (/proc,/dev,/sys,/run), so keep them.
ignore-dirs:
  - /proc
  - /dev
  - /sys
  - /run
  # OrbStack's virtual filesystem: huge, slow to walk, sizes are not real disk usage
  - /Users/maks/OrbStack

# Gotham accents. result-row matches `ls` (eza): gdu can't reference the
# terminal ANSI palette (tcell names resolve to W3C RGB, not ANSI), so
# these are the gotham hex values of ANSI blue (dirs) and green (sizes).
style:
  selected-row:
    text-color: "#d3ebe9"
    background-color: "#0a3749"
  marked:
    text-color: "#d3ebe9"
    background-color: "#245361"
  result-row:
    number-color: "#2aa889"
    directory-color: "#195466"
  # Header/footer like the tmux status bar: body text on surface, gold numbers
  header:
    text-color: "#99d1ce"
    background-color: "#091f2e"
  footer:
    text-color: "#99d1ce"
    background-color: "#091f2e"
    number-color: "#edb443"

# gdu — interactive disk usage explorer. Linked to ~/.gdu.yaml
# ignore-dirs replaces gdu's defaults (/proc,/dev,/sys,/run), so keep them.
ignore-dirs:
  - /proc
  - /dev
  - /sys
  - /run
  # OrbStack's virtual filesystem: huge, slow to walk, sizes are not real disk usage
  - /Users/maks/OrbStack

# Srcery accents. result-row matches `ls` (eza): gdu can't reference the
# terminal ANSI palette (tcell names resolve to W3C RGB, not ANSI), so
# these are the srcery hex values of ANSI blue (dirs) and green (sizes).
style:
  selected-row:
    text-color: "#fce8c3"
    background-color: "#3a3a3a"
  marked:
    text-color: "#fce8c3"
    background-color: "#444444"
  result-row:
    number-color: "#519f50"
    directory-color: "#2c78bf"
  # Header/footer like the tmux status bar: body text on surface, yellow numbers
  header:
    text-color: "#fce8c3"
    background-color: "#303030"
  footer:
    text-color: "#fce8c3"
    background-color: "#303030"
    number-color: "#fbb829"
